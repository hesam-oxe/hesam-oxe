name: "📡 Blog RSS -> README"

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/update_blog.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md || true
          git commit -m "📡 blog feed sync [skip ci]" || echo "nothing to commit"
          git push
