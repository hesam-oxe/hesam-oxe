name: "🐍 Generate Contribution Snake"

on:
  schedule:
    - cron: "0 0 * * *" # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (Blood & Plasma palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23DC143C&color_dots=%23161B22,%233D0C14,%238B0000,%23DC143C,%2339FF14
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23B026FF&color_dots=%23161B22,%233D0C14,%238B0000,%23DC143C,%2300E5FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
