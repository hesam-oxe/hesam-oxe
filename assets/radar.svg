<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace"><title>threat radar — targets locked</title>
  <defs>
    <radialGradient id="sweepGrad" gradientUnits="userSpaceOnUse" cx="190" cy="122" r="88">
      <stop offset="0" stop-color="#DC143C" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#B026FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="radarBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="380" height="240" rx="10" fill="url(#radarBg)" stroke="#DC143C" stroke-width="1" opacity="0.97"/>
  <text x="190" y="24" text-anchor="middle" font-size="12" letter-spacing="4" fill="#DC143C">// THREAT RADAR</text>

  <!-- radar grid -->
  <g transform="translate(190,122)">
    <circle r="86" fill="#0D0D14" stroke="#26263a" stroke-width="1"/>
    <circle r="60" fill="none" stroke="#26263a" stroke-width="1"/>
    <circle r="34" fill="none" stroke="#26263a" stroke-width="1"/>
    <circle r="10" fill="none" stroke="#3a3a55" stroke-width="1"/>
    <line x1="-86" y1="0" x2="86" y2="0" stroke="#26263a" stroke-width="1"/>
    <line x1="0" y1="-86" x2="0" y2="86" stroke="#26263a" stroke-width="1"/>

    <!-- sweep wedge -->
    <path d="M0,0 L0,-86 A86,86 0 0 1 60.8,-60.8 Z" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
    </path>
    <!-- sweep leading edge -->
    <line x1="0" y1="0" x2="0" y2="-86" stroke="#DC143C" stroke-width="1.6" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.6s" repeatCount="indefinite"/>
    </line>

    <!-- blip 1 : LINUX KERNEL -->
    <g>
      <circle cx="34" cy="-28" r="3.2" fill="#DC143C">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.5;0.62" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="34" cy="-28" r="3.2" fill="none" stroke="#DC143C">
        <animate attributeName="r" values="3;14" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="-38" text-anchor="middle" font-size="8" letter-spacing="1" fill="#DC143C" opacity="0">
        torvalds/linux<tspan x="34" dy="9" fill="#39FF14" font-weight="700">LOCKED</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.12;0.5;0.62;1" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blip 2 : LLVM -->
    <g>
      <circle cx="-42" cy="18" r="3.2" fill="#B026FF">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.3;0.72;0.85" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-42" cy="18" r="3.2" fill="none" stroke="#B026FF">
        <animate attributeName="r" values="3;14" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="-42" y="36" text-anchor="middle" font-size="8" letter-spacing="1" fill="#B026FF" opacity="0">
        llvm/llvm-project<tspan x="-42" dy="9" fill="#39FF14" font-weight="700">LOCKED</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.34;0.72;0.85;1" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blip 3 : OWASP -->
    <g>
      <circle cx="20" cy="44" r="3.2" fill="#00E5FF">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.55;0.9;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="44" r="3.2" fill="none" stroke="#00E5FF">
        <animate attributeName="r" values="3;14" dur="1.6s" begin="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.6s" begin="1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="62" text-anchor="middle" font-size="8" letter-spacing="1" fill="#00E5FF" opacity="0">
        OWASP<tspan x="20" dy="9" fill="#39FF14" font-weight="700">LOCKED</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.59;0.9;0.96;1" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blip 4 : TYPESCRIPT-GO -->
    <g>
      <circle cx="-24" cy="-50" r="3.2" fill="#39FF14">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.72;0.94;1" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <text x="-24" y="-60" text-anchor="middle" font-size="8" letter-spacing="1" fill="#39FF14" opacity="0">
        typescript-go<tspan x="-24" dy="9" fill="#39FF14" font-weight="700">LOCKED</tspan>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.72;0.76;0.94;0.99;1" dur="3.6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- center dot -->
    <circle r="2.5" fill="#F2F2F5"/>
  </g>

  <text x="190" y="226" text-anchor="middle" font-size="11" letter-spacing="3" fill="#39FF14">SCANNING GITHUB…<tspan fill="#5c5c70"> 4 TARGETS LOCKED · 0 ESCAPED</tspan></text>
</svg>
