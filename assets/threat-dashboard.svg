<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace"><title>combat record — animated counters</title>
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#07070C"/>
