<svg xmlns="http://www.w3.org/2000/svg" width="760" height="185" viewBox="0 0 760 185" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="dashBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#07070C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="185" rx="10" fill="url(#dashBg)" stroke="#DC143C" stroke-width="1"/>
  <text x="30" y="32" font-size="14" letter-spacing="5" fill="#F2F2F5">// COMBAT RECORD <tspan fill="#5c5c70">— live fire telemetry</tspan></text>
  <circle cx="722" cy="27" r="4" fill="#FF1744">
    <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- BOX 1 : COMMITS FIRED -->
  <rect x="30" y="48" width="170" height="78" rx="8" fill="#0D0D15" stroke="#DC143C" stroke-width="1.2"/>
  <text x="115" y="70" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8a8aa0">COMMITS FIRED</text>
  <g text-anchor="middle" font-size="24" font-weight="800" fill="#DC143C">
    <text x="115" y="102">0<animate attributeName="opacity" values="1;0;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="115" y="102" opacity="0">3.3K<animate attributeName="opacity" values="0;1;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="115" y="102" opacity="0">6.6K<animate attributeName="opacity" values="0;0;1;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="115" y="102" opacity="0">10.0K<animate attributeName="opacity" values="0;0;0;1;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="115" y="102">13.4K<animate attributeName="opacity" values="0;0;0;0;1" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- BOX 2 : LANGUAGES DEPLOYED -->
  <rect x="215" y="48" width="170" height="78" rx="8" fill="#0D0D15" stroke="#B026FF" stroke-width="1.2"/>
  <text x="300" y="70" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8a8aa0">LANGUAGES DEPLOYED</text>
  <g text-anchor="middle" font-size="24" font-weight="800" fill="#B026FF">
    <text x="300" y="102">4<animate attributeName="opacity" values="1;0;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="300" y="102" opacity="0">6<animate attributeName="opacity" values="0;1;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="300" y="102" opacity="0">8<animate attributeName="opacity" values="0;0;1;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="300" y="102" opacity="0">10<animate attributeName="opacity" values="0;0;0;1;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="300" y="102">12+<animate attributeName="opacity" values="0;0;0;0;1" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- BOX 3 : KERNEL PANICS CAUSED -->
  <rect x="400" y="48" width="170" height="78" rx="8" fill="#0D0D15" stroke="#FF1744" stroke-width="1.2"/>
  <text x="485" y="70" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8a8aa0">KERNEL PANICS CAUSED</text>
  <g text-anchor="middle" font-size="24" font-weight="800" fill="#FF1744">
    <text x="485" y="102">10<animate attributeName="opacity" values="1;0;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="485" y="102" opacity="0">250<animate attributeName="opacity" values="0;1;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="485" y="102" opacity="0">500<animate attributeName="opacity" values="0;0;1;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="485" y="102" opacity="0">750<animate attributeName="opacity" values="0;0;0;1;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="485" y="102">999+
      <animate attributeName="opacity" values="0;0;0;0;1" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#FF1744;#FFB000;#FF1744" dur="0.7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- BOX 4 : COFFEE OVERDOSE -->
  <rect x="585" y="48" width="145" height="78" rx="8" fill="#0D0D15" stroke="#00E5FF" stroke-width="1.2"/>
  <text x="657" y="70" text-anchor="middle" font-size="10.5" letter-spacing="2" fill="#8a8aa0">COFFEE OVERDOSE</text>
  <g text-anchor="middle" font-size="24" font-weight="800" fill="#00E5FF">
    <text x="657" y="102">10%<animate attributeName="opacity" values="1;0;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="657" y="102" opacity="0">40%<animate attributeName="opacity" values="0;1;0;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="657" y="102" opacity="0">70%<animate attributeName="opacity" values="0;0;1;0;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="657" y="102" opacity="0">95%<animate attributeName="opacity" values="0;0;0;1;0" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
    <text x="657" y="102">∞<animate attributeName="opacity" values="0;0;0;0;1" calcMode="discrete" keyTimes="0;0.2;0.4;0.6;0.8" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- bottom captions -->
  <text x="380" y="160" text-anchor="middle" font-size="12" letter-spacing="3">
    <tspan fill="#39FF14">PRECISION: DEADLY</tspan>
    <tspan fill="#3a3a55"> · </tspan>
    <tspan fill="#00E5FF">AVAILABILITY: 24/7</tspan>
    <tspan fill="#3a3a55"> · </tspan>
    <tspan fill="#DC143C" font-weight="700">MERCY: NOT FOUND</tspan>
    <animate attributeName="opacity" values="1;1;0.4;0.4;1" keyTimes="0;0.4;0.45;0.55;1" dur="3s" repeatCount="indefinite"/>
  </text>
</svg>
