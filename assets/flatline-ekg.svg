<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" viewBox="0 0 760 200" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="ekgBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="pulseG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#39FF14" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="defibG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="760" height="200" rx="10" fill="url(#ekgBg)" stroke="#39FF14" stroke-width="1"/>
  <text x="30" y="30" font-size="13" letter-spacing="4" fill="#39FF14">// OPERATOR VITALS <tspan fill="#5c5c70">— cardiac telemetry · live</tspan></text>
  <text x="660" y="30" font-size="11" letter-spacing="2" fill="#5c5c70">LEAD II · 25mm/s</text>

  <!-- grid -->
  <g stroke="#12121c" stroke-width="1">
    <line x1="0" y1="50" x2="760" y2="50"/>
    <line x1="0" y1="75" x2="760" y2="75"/>
    <line x1="0" y1="125" x2="760" y2="125"/>
    <line x1="0" y1="150" x2="760" y2="150"/>
  </g>
  <line x1="0" y1="100" x2="760" y2="100" stroke="#1a1a2a" stroke-width="1"/>

  <!-- ══ ECG trace : heartbeat → flatline → shock → heartbeat ══ -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0,100 L40,100 L52,62 L64,138 L76,100 L120,100 L132,62 L144,138 L156,100 L200,100 L212,62 L224,138 L236,100 L280,100 L292,62 L304,138 L316,100 L360,100 L372,62 L384,138 L396,100 L440,100"
          stroke="url(#pulseG)">
      <animate attributeName="opacity" values="1;1;1;1;0.4;0.4;1;1" keyTimes="0;0.45;0.5;0.55;0.58;0.66;0.7;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- flatline segment -->
    <path d="M440,100 L520,100" stroke="#FF1744" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.55;0.58;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <!-- post-shock restart : bigger spike then normal beats -->
    <path d="M520,100 L532,54 L546,150 L558,100 L600,100 L612,62 L624,138 L636,100 L680,100 L692,62 L704,138 L716,100 L760,100"
          stroke="url(#pulseG)" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;1;1" keyTimes="0;0.55;0.7;0.72;0.8;1" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- shock flash at flatline end -->
  <circle cx="520" cy="100" r="60" fill="url(#defibG)" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.545;0.55;0.57;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="r" values="10;10;90;90" keyTimes="0;0.545;0.56;1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- status readout -->
  <g font-size="12" letter-spacing="2">
    <text x="30" y="180" fill="#39FF14">HR: <tspan font-weight="700">∞ bpm</tspan>
      <animate attributeName="fill" values="#39FF14;#39FF14;#FF1744;#FF1744;#39FF14;#39FF14" keyTimes="0;0.45;0.5;0.56;0.66;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="170" y="180" fill="#00E5FF">SPO₂: 100% <tspan fill="#5c5c70">(runs on caffeine)</tspan></text>
    <text x="450" y="180" fill="#B026FF">RHYTHM: <tspan font-weight="700">WEAPONIZED</tspan></text>
    <text x="30" y="52" font-size="11" fill="#FF1744" opacity="0">⚠ PATIENT FLATLINED — CHARGING DEFIBRILLATOR…
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.54;0.56;1" dur="6s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="52" font-size="11" fill="#00E5FF" opacity="0">⚡ SHOCK DELIVERED — RHYTHM RESTORED — CODING RESUMED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.6;0.68;0.72;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
