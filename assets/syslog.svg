      <tspan x="30" dy="17" fill="#8a8aa0">[  0.000042] Memory: 666TB RAM, all of it swapped to rage</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  0.001337] WARN: caffeine levels critical — overclocking</tspan>
      <tspan x="30" dy="17" fill="#39FF14">[  0.002000] init: weaponized-code.service started</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  0.666000] usb 6-6:0x66: keyboard connected — deploy mode</tspan>
      <tspan x="30" dy="17" fill="#B026FF">[  1.337000] threat detected: deadline approaching</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  1.337001] threat neutralized. deadline deleted.</tspan>
      <tspan x="30" dy="17" fill="#39FF14">[  2.000000] watchdog: operator still alive (impossible)</tspan>
      <tspan x="30" dy="17" fill="#00E5FF">[  3.141592] cloud: k8s cluster responding to commands</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  4.044000] filesystem: /dev/fear not found — good.</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  5.000000] OVERKILL protocol armed and unapologetic</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 40;0 -220" dur="6s" repeatCount="indefinite"/>
    </text>
    <!-- stream 2 : identical, follows behind for seamless loop -->
    <text x="30" y="0">
      <tspan x="30" fill="#39FF14">[  0.000000] Linux HellBeast 6.6.6-hellfire x86_64 booting…</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  0.000001] CPU: 13th Gen Hesam i9-99999K @ 6.66GHz</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  0.000042] Memory: 666TB RAM, all of it swapped to rage</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  0.001337] WARN: caffeine levels critical — overclocking</tspan>
      <tspan x="30" dy="17" fill="#39FF14">[  0.002000] init: weaponized-code.service started</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  0.666000] usb 6-6:0x66: keyboard connected — deploy mode</tspan>
      <tspan x="30" dy="17" fill="#B026FF">[  1.337000] threat detected: deadline approaching</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  1.337001] threat neutralized. deadline deleted.</tspan>
      <tspan x="30" dy="17" fill="#39FF14">[  2.000000] watchdog: operator still alive (impossible)</tspan>
      <tspan x="30" dy="17" fill="#00E5FF">[  3.141592] cloud: k8s cluster responding to commands</tspan>
      <tspan x="30" dy="17" fill="#8a8aa0">[  4.044000] filesystem: /dev/fear not found — good.</tspan>
      <tspan x="30" dy="17" fill="#DC143C">[  5.000000] OVERKILL protocol armed and unapologetic</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 244;0 -16" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="380" y="226" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c5c70">12 EVENTS/SEC · <tspan fill="#DC143C">0 REGRETS LOGGED</tspan></text>
</svg>
