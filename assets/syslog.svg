<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="sysBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="fadeMask2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="sysfade"><rect x="0" y="0" width="760" height="240" fill="url(#fadeMask2)"/></mask>
  </defs>

  <rect x="0" y="0" width="760" height="240" rx="10" fill="url(#sysBg)" stroke="#00E5FF" stroke-width="1"/>
  <text x="30" y="28" font-size="13" letter-spacing="4" fill="#00E5FF">// DMESG — HELLBEAST SYSTEM LOG <tspan fill="#5c5c70">· tail -f /var/log/wrath</tspan></text>
  <circle cx="722" cy="23" r="4" fill="#FF1744">
    <animate attributeName="opacity" values="1;1;0.1;0.1" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <g mask="url(#sysfade)" font-size="12.5">
    <!-- stream 1 : scrolls up, replaced by stream 2 seamlessly -->
    <text x="30" y="0">
      <tspan x="30" fill="#39FF14">[  0.000000] Linux HellBeast 6.6.6-hellfire x86_64 booting…</tspan>
