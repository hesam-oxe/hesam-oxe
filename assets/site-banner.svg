<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120" font-family="'Cascadia Code','Fira Code',monospace"><title>fortress gateway — hesam-oxe.github.io online</title>
  <defs>
    <linearGradient id="sbBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="0.5" stop-color="#1A080D"/>
      <stop offset="1" stop-color="#0A0A10"/>
