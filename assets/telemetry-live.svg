/text><rect x="58" y="304" width="560" height="11" rx="2.5" fill="#10161F" stroke="#264056"/><rect x="59" y="305" width="218" height="9" rx="2" fill="#FF6B35" opacity=".9"><animate attributeName="width" values="0;218" dur="1.26s" begin="1.00s" fill="freeze"/></rect><text x="640" y="298" class="val" fill="#FF6B35">31 → 12 ops</text><text x="760" y="298" class="lbl2">−61% · 5 folds · 2 DCE</text><text x="58" y="342" class="mono" fill="#C7EFFB" font-weight="600">N-BODY energy drift</text><rect x="58" y="348" width="560" height="11" rx="2.5" fill="#10161F" stroke="#264056"/><rect x="59" y="349" width="560" height="9" rx="2" fill="#8BFF9B" opacity=".9"><animate attributeName="width" values="0;560" dur="1.40s" begin="1.25s" fill="freeze"/></rect><text x="640" y="342" class="val" fill="#8BFF9B">0.0000%</text><text x="760" y="342" class="lbl2">velocity-Verlet · 19 900 pairs</text><rect x="40" y="96" width="920" height="290" rx="8" fill="none" stroke="#1B2533"/><text x="63" y="90" class="lbl">▟ MEASUREMENTS — fixed by execution, not estimate</text>
