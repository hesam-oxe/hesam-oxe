<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="300" rx="10" fill="url(#termBg)" stroke="#39FF14" stroke-width="1.2"/>

  <!-- mac-style traffic lights, but hellish -->
  <circle cx="26" cy="22" r="6" fill="#DC143C"/>
  <circle cx="46" cy="22" r="6" fill="#FFB000"/>
  <circle cx="66" cy="22" r="6" fill="#39FF14"/>
  <text x="380" y="26" text-anchor="middle" font-size="11" letter-spacing="3" fill="#5c5c70">root@hellfire:~ — ssh session · ring-0 shell</text>

  <line x1="14" y1="38" x2="746" y2="38" stroke="#22223a" stroke-width="1"/>

  <g font-size="13.5">
    <!-- prompt 1 : nmap -->
    <text x="30" y="66" fill="#39FF14" font-weight="700">root@hellfire:~#</text>
    <text x="160" y="66" fill="#F2F2F5">nmap -sS -T5 github.com/global-stack<tspan fill="#39FF14">▮</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.05;0.08;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- nmap output, line by line -->
    <text x="46" y="88" fill="#8a8aa0" opacity="0">Starting Nmap 7.95 ( https://nmap.org )
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.14;0.17;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="106" fill="#8a8aa0" opacity="0">PORT     STATE  SERVICE
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.2;0.23;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="124" fill="#8a8aa0" opacity="0">22/tcp   open   ssh          <tspan fill="#39FF14">← breached</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.26;0.29;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="142" fill="#8a8aa0" opacity="0">443/tcp  open   https         <tspan fill="#39FF14">← breached</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.32;0.35;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="160" fill="#FFB000" opacity="0">OS guess: every layer from silicon to cloud — 100% owned
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.38;0.41;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- prompt 2 : rm fear -->
    <text x="30" y="190" fill="#39FF14" font-weight="700">root@hellfire:~#</text>
    <text x="160" y="190" fill="#F2F2F5" opacity="0">sudo rm -rf /fear /doubt /limits<tspan fill="#39FF14">▮</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.42;0.46;0.5;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- prompt 3 : fork bombs of creativity -->
    <text x="30" y="212" fill="#39FF14" font-weight="700">root@hellfire:~#</text>
    <text x="160" y="212" fill="#F2F2F5" opacity="0">while true; do commit --weapon; push --force; done<tspan fill="#39FF14">▮</tspan>
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.52;0.56;0.6;1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- output : weapon stream -->
    <text x="46" y="234" fill="#DC143C" opacity="0">[kernel] compiling freedom… 0 warnings, 0 mercy
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.6;0.64;0.68;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="252" fill="#B026FF" opacity="0">[llvm] 12 languages deployed · battle-tested
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.7;0.74;0.78;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="270" fill="#00E5FF" opacity="0">[cloud] k8s cluster kneeling — pods bowing
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.8;0.84;0.88;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="46" y="288" fill="#39FF14" opacity="0">status: <tspan fill="#FF1744" font-weight="700">UNSTOPPABLE</tspan> — uptime ∞
      <animate attributeName="opacity" values="0;0;1;1;1" keyTimes="0;0.9;0.93;1;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking main cursor -->
  <text x="30" y="66" font-size="13.5">
    <tspan fill="#39FF14" font-weight="700"> </tspan>
  </text>
</svg>
