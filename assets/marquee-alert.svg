      </text>
      <text x="1128" y="29" font-size="14" letter-spacing="1">
        <tspan fill="#DC143C" font-weight="700">⚠ BREAKING:</tspan><tspan fill="#E6E6E6"> HESAM JAMALI ENTERED RING-0 </tspan><tspan fill="#B026FF" font-weight="700">▚</tspan><tspan fill="#E6E6E6"> KERNEL PANICS ARE HIS WARM-UP </tspan><tspan fill="#00E5FF" font-weight="700">▚</tspan><tspan fill="#E6E6E6"> 0-DAYS FEAR HIM </tspan><tspan fill="#39FF14" font-weight="700">▚</tspan><tspan fill="#E6E6E6"> NO LAYER UNTOUCHED </tspan><tspan fill="#DC143C" font-weight="700">▚</tspan>
      </text>
