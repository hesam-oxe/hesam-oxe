<svg xmlns="http://www.w3.org/2000/svg" width="760" height="38" viewBox="0 0 760 38" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace"><title>hazard divider</title>
  <defs>
    <pattern id="hazard" width="28" height="38" patternUnits="userSpaceOnUse" patternTransform="skewX(-28)">
      <rect width="14" height="38" fill="#DC143C"/>
      <rect x="14" width="14" height="38" fill="#0A0A0F"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 0" dur="1.1s" repeatCount="indefinite" additive="sum"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="760" height="38" rx="6" fill="url(#hazard)" opacity="0.85"/>

  <!-- center label plate -->
  <rect x="170" y="6" width="420" height="26" rx="4" fill="#05050A" stroke="#DC143C" stroke-width="1.4"/>
  <text x="380" y="24" text-anchor="middle" font-size="12.5" letter-spacing="3" fill="#F2F2F5">⚠ CAUTION :: KERNEL-LEVEL OPERATOR AT WORK
    <animate attributeName="fill" values="#F2F2F5;#DC143C;#F2F2F5" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
