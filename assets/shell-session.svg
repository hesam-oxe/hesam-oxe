<text x="500.0" y="46" text-anchor="middle" class="big" fill="url(#gSpec)">▛ SHELL SESSION</text>
<text x="500.0" y="66" text-anchor="middle" class="lbl">COMMANDS ANNOTATED SO THE READER CAN RUN THEM, NOT BELIEVE THEM</text>
<text x="58" y="112" font-size="13" fill="#5A6B84" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="0s" fill="freeze"/># git clone https://github.com/hesam-oxe/hesam-oxe.github.io &amp;&amp; cd engine</text><text x="58" y="139" font-size="13" fill="#C7EFFB" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".8s" fill="freeze"/>$ node -e 'const b=…base64; console.log(b.length, WebAssembly.validate(b), fib(30))'</text><text x="58" y="166" font-size="13" fill="#00E5FF" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.6s" fill="freeze"/>253  true  832040</text><text x="58" y="193" font-size="13" fill="#C7EFFB" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="2.4s" fill="freeze"/>$ sha256sum core.decoded</text><text x="58" y="220" font-size="13" fill="#FFB000" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="3.2s" fill="freeze"/>c06fde310b4c5cae97be1617f44cdabef567f738e84984e742e945b8d1ab377d  MATCH ✓</text><text x="58" y="247" font-size="13" fill="#C7EFFB" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="4.0s" fill="freeze"/>$ sha256sum README.md        # cross-check the seal of record</text><text x="58" y="274" font-size="13" fill="#B026FF" opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="4.8s" fill="freeze"/>read assets/seal.svg — the hash is recomputed by CI on every README push</text><rect x="57" y="300" width="11" height="16" fill="#00E5FF"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect><text x="58" y="94" class="lbl">▟ PSL — /bin/prove-it — session stream (auto-replay)</text>
<text x="500.0" y="294" text-anchor="middle" font-size="11" fill="#5A6B84">copy · run · be corrected — that is the contract</text>
<rect width="1000" height="320" fill="url(#gVig)" pointer-events="none"/>
