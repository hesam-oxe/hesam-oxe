<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="'Cascadia Code','Fira Code','JetBrains Mono',SFMono-Regular,Consolas,Menlo,monospace" role="img" aria-label="▛ SHELL SESSION"><title>▛ SHELL SESSION</title>
<defs>
<linearGradient id="gFire" x1="0" x2="1"><stop offset="0" stop-color="#8B0020"/><stop offset=".28" stop-color="#DC143C"/><stop offset=".58" stop-color="#FF6B35"/><stop offset=".82" stop-color="#FFB000"/><stop offset="1" stop-color="#FFE9A0"/></linearGradient>
<linearGradient id="gSpec" x1="0" x2="1"><stop offset="0" stop-color="#DC143C"/><stop offset=".26" stop-color="#FF6B35"/><stop offset=".52" stop-color="#FFB000"/><stop offset=".76" stop-color="#00E5FF"/><stop offset="1" stop-color="#B026FF"/>
 <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="gIce" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#5B8CFF"/><stop offset="1" stop-color="#B026FF"/></linearGradient>
<linearGradient id="gPanel" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#131A25"/><stop offset=".45" stop-color="#0B1017"/><stop offset="1" stop-color="#05080D"/></linearGradient>
<radialGradient id="gVig" cx="50%" cy="45%" r="72%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".72"/></radialGradient>
<filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
 .big{{fill:#E9F4FF;font-size:16px;font-weight:800;letter-spacing:1.5px}}
