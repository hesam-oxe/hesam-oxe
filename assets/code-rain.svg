<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="fadeMask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mfade">
      <rect x="0" y="0" width="380" height="240" fill="url(#fadeMask)"/>
    </mask>
    <linearGradient id="rainBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="380" height="240" rx="10" fill="url(#rainBg)" stroke="#B026FF" stroke-width="1" opacity="0.97"/>
  <text x="190" y="24" text-anchor="middle" font-size="12" letter-spacing="4" fill="#B026FF">// OPCODE RAIN · x86_64</text>

  <g mask="url(#mfade)" font-size="13">
    <!-- ══ LAYER 1 : far, dim, slow ══ -->
    <text x="26" fill="#4a0d1c" font-size="11">
      mov<tspan x="26" dy="17">xor</tspan><tspan x="26" dy="17">push</tspan><tspan x="26" dy="17">jmp</tspan><tspan x="26" dy="17">ret</tspan><tspan x="26" dy="17">mov</tspan><tspan x="26" dy="17">xor</tspan><tspan x="26" dy="17">push</tspan><tspan x="26" dy="17">jmp</tspan><tspan x="26" dy="17">ret</tspan><tspan x="26" dy="17">mov</tspan><tspan x="26" dy="17">xor</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -204;0 0" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="222" fill="#3a1650" font-size="11">
      nop<tspan x="222" dy="17">call</tspan><tspan x="222" dy="17">sub</tspan><tspan x="222" dy="17">lea</tspan><tspan x="222" dy="17">nop</tspan><tspan x="222" dy="17">call</tspan><tspan x="222" dy="17">sub</tspan><tspan x="222" dy="17">lea</tspan><tspan x="222" dy="17">nop</tspan><tspan x="222" dy="17">call</tspan><tspan x="222" dy="17">sub</tspan><tspan x="222" dy="17">lea</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -204;0 0" dur="8.2s" begin="0.9s" repeatCount="indefinite"/>
    </text>

    <!-- ══ LAYER 2 : mid, bright opcodes with operands ══ -->
    <text x="71" fill="#8B0F26">
      MOV EAX<tspan x="71" dy="17">XOR R12</tspan><tspan x="71" dy="17" fill="#DC143C" font-weight="700">INT 0x80</tspan><tspan x="71" dy="17">JMP [RBX]</tspan><tspan x="71" dy="17">RET</tspan><tspan x="71" dy="17">MOV EAX</tspan><tspan x="71" dy="17">XOR R12</tspan><tspan x="71" dy="17" fill="#DC143C" font-weight="700">INT 0x80</tspan><tspan x="71" dy="17">JMP [RBX]</tspan><tspan x="71" dy="17">RET</tspan><tspan x="71" dy="17">MOV EAX</tspan><tspan x="71" dy="17">XOR R12</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -204;0 0" dur="4.2s" begin="0.6s" repeatCount="indefinite"/>
    </text>
    <text x="166" fill="#5A1E7A">
      SYSCALL<tspan x="166" dy="17" fill="#B026FF" font-weight="700">CLI</tspan><tspan x="166" dy="17">STI</tspan><tspan x="166" dy="17">POP RBP</tspan><tspan x="166" dy="17">DIV</tspan><tspan x="166" dy="17">SYSCALL</tspan><tspan x="166" dy="17" fill="#B026FF" font-weight="700">CLI</tspan><tspan x="166" dy="17">STI</tspan><tspan x="166" dy="17">POP RBP</tspan><tspan x="166" dy="17">DIV</tspan><tspan x="166" dy="17">SYSCALL</tspan><tspan x="166" dy="17" fill="#B026FF" font-weight="700">CLI</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -204;0 0" dur="5.1s" begin="1.1s" repeatCount="indefinite"/>
    </text>
    <text x="262" fill="#8B0F26">
      LOCK INC<tspan x="262" dy="17" fill="#DC143C" font-weight="700">0xDEAD</tspan><tspan x="262" dy="17">DEC CX</tspan><tspan x="262" dy="17">OR AH,AL</tspan><tspan x="262" dy="17">LOCK INC</tspan><tspan x="262" dy="17">DEC CX</tspan><tspan x="262" dy="17" fill="#DC143C" font-weight="700">0xDEAD</tspan><tspan x="262" dy="17">OR AH,AL</tspan><tspan x="262" dy="17">LOCK INC</tspan><tspan x="262" dy="17">DEC CX</tspan><tspan x="262" dy="17">OR AH,AL</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -204;0 0" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </text>

    <!-- ══ LAYER 3 : near, fast, leading glow column ══ -->
    <text x="118" fill="#c41f4a" font-size="15" font-weight="700">
      IRET<tspan x="118" dy="19">CMP</tspan><tspan x="118" dy="19" fill="#00E5FF">RAX</tspan><tspan x="118" dy="19">SHL 4</tspan><tspan x="118" dy="19">IRET</tspan><tspan x="118" dy="19">CMP</tspan><tspan x="118" dy="19" fill="#00E5FF">RAX</tspan><tspan x="118" dy="19">SHL 4</tspan><tspan x="118" dy="19">IRET</tspan><tspan x="118" dy="19">CMP</tspan><tspan x="118" dy="19" fill="#00E5FF">RAX</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -209;0 0" dur="2.7s" begin="0.2s" repeatCount="indefinite"/>
    </text>
    <text x="316" fill="#d24bb8" font-size="15" font-weight="700">
      HLT<tspan x="316" dy="19" fill="#FF1744">0x1F</tspan><tspan x="316" dy="19">IN AL</tspan><tspan x="316" dy="19">OUT 0x64</tspan><tspan x="316" dy="19">WAIT</tspan><tspan x="316" dy="19">HLT</tspan><tspan x="316" dy="19" fill="#FF1744">0x1F</tspan><tspan x="316" dy="19">IN AL</tspan><tspan x="316" dy="19">OUT 0x64</tspan><tspan x="316" dy="19">WAIT</tspan><tspan x="316" dy="19">HLT</tspan>
      <animateTransform attributeName="transform" type="translate" values="0 -209;0 0" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- hex stream footer, ticking like a memory dump -->
  <text x="190" y="226" text-anchor="middle" font-size="11" letter-spacing="3" fill="#DC143C">RING 0 · UNRESTRICTED<tspan fill="#5c5c70"> · 0x7FFE0000 → ∞</tspan></text>
</svg>
