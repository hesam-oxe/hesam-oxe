<text x="500.0" y="66" text-anchor="middle" class="lbl">THE CAMPAIGN — kernel → compiles → shipped upstream → engines → boss</text>
<rect x="57" y="104" width="4" height="288" fill="#1B2533"/><animate attributeName="opacity" values=".8;1;.8" dur="4s" repeatCount="indefinite"/><circle cx="59" cy="118" r="6" fill="#DC143C" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="2.0s" repeatCount="indefinite"/></circle><text x="80" y="116" font-size="14" font-weight="800" fill="#E9F4FF">SINUX KERNEL</text><text x="80" y="133" font-size="11.5" fill="#8FA3BF">v1.0-alpha · boot, memory management, scheduling — C + asm</text><text x="926" y="172" text-anchor="end" font-size="14" font-weight="800" fill="#E9F4FF">LLVM · CodeGenPrepare</text><text x="926" y="189" text-anchor="end" font-size="11.5" fill="#8FA3BF">crash diagnosed · patch #201443 — premise retracted, lesson kept</text><circle cx="941" cy="174" r="6" fill="#FF6B35" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="2.3s" repeatCount="indefinite"/></circle><circle cx="59" cy="230" r="6" fill="#FFB000" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="2.6s" repeatCount="indefinite"/></circle><text x="80" y="228" font-size="14" font-weight="800" fill="#E9F4FF">OWASP Agent Memory Guard</text><text x="80" y="245" font-size="11.5" fill="#8FA3BF">7 merged patches · #18…#42 · scanner, adapters, exporter, taxonomy</text><text x="926" y="284" text-anchor="end" font-size="14" font-weight="800" fill="#E9F4FF">GO COMPILER</text><text x="926" y="301" text-anchor="end" font-size="11.5" fill="#8FA3BF">size-cache in StdSizes · exponential compile time killed · #79314 open</text><circle cx="941" cy="286" r="6" fill="#00E5FF" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="2.9s" repeatCount="indefinite"/></circle><circle cx="59" cy="342" r="6" fill="#B026FF" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="3.2s" repeatCount="indefinite"/></circle><text x="80" y="340" font-size="14" font-weight="800" fill="#E9F4FF">SITE LIVE — FORGE</text><text x="80" y="357" font-size="11.5" fill="#8FA3BF">compiler · wasm · sha-256 · nfa · raytracer · n-body + nn · deflate · ci, in-browser</text><text x="926" y="396" text-anchor="end" font-size="14" font-weight="800" fill="#E9F4FF">BOSS: ReDoS</text><text x="926" y="413" text-anchor="end" font-size="11.5" fill="#8FA3BF">(a|a)*b ×40 — Thompson NFA · 0.66 ms · linear by construction</text><circle cx="941" cy="398" r="6" fill="#8BFF9B" filter="url(#fGlow)"><animate attributeName="r" values="6;7.5;6" dur="3.5s" repeatCount="indefinite"/></circle><text x="60" y="94" class="lbl">▟ CAMPAIGN LOG — KILL CHAIN, top-down</text>
<text x="500.0" y="444" text-anchor="middle" font-size="11" fill="#5A6B84">every node links from README — PR numbers are real, nothing is aspirational</text>
