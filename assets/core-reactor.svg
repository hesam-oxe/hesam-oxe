<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="reactorBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0A10"/>
      <stop offset="1" stop-color="#05050A"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.25" stop-color="#FF1744"/>
      <stop offset="0.7" stop-color="#DC143C" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="380" height="240" rx="10" fill="url(#reactorBg)" stroke="#B026FF" stroke-width="1" opacity="0.97"/>
  <text x="190" y="24" text-anchor="middle" font-size="12" letter-spacing="4" fill="#B026FF">// FUSION CORE</text>

  <!-- faint grid -->
  <g stroke="#161624" stroke-width="1">
    <line x1="0" y1="120" x2="380" y2="120"/><line x1="190" y1="40" x2="190" y2="200"/>
  </g>

  <!-- reactor assembly -->
  <g transform="translate(190,122)">
    <!-- outer segmented ring : slow CW -->
    <circle r="82" fill="none" stroke="#DC143C" stroke-width="5" stroke-dasharray="46 18" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <!-- mid ring : CCW dashed purple -->
    <circle r="64" fill="none" stroke="#B026FF" stroke-width="3.5" stroke-dasharray="10 8" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <!-- inner ring : fast CW thin cyan -->
    <circle r="47" fill="none" stroke="#00E5FF" stroke-width="2" stroke-dasharray="30 12" opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting particles -->
    <g>
      <circle cx="0" cy="-82" r="3.4" fill="#39FF14">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-64" r="2.6" fill="#DC143C">
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-47" r="2.2" fill="#FFFFFF">
        <animateTransform attributeName="transform" type="rotate" from="90" to="450" dur="2.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- pulsing plasma core -->
    <circle r="20" fill="url(#coreGlow)">
      <animate attributeName="r" values="19;24;19" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="#FFFFFF" opacity="0.95">
      <animate attributeName="opacity" values="0.95;0.55;0.95" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#39FF14" font-weight="700">OUTPUT: 1.21 GW <tspan fill="#5c5c70">·</tspan> <tspan fill="#DC143C">STABILITY: UNSTABLE</tspan>
    <animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.45;0.5;0.55;1" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
