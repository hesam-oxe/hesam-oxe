<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <linearGradient id="termGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC143C" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#B026FF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="10" y="10" width="740" height="310" rx="12" fill="#0A0A10" stroke="#DC143C" stroke-width="1.5" opacity="0.97"/>
  <rect x="10" y="10" width="740" height="310" rx="12" fill="url(#termGlow)"/>
  <rect x="11.5" y="11.5" width="737" height="307" rx="11" fill="none" stroke="#B026FF" stroke-width="0.6" opacity="0.35"/>

  <!-- title bar -->
  <rect x="11.5" y="11.5" width="737" height="34" rx="11" fill="#101018"/>
  <line x1="12" y1="45" x2="748" y2="45" stroke="#DC143C" stroke-width="1" opacity="0.5"/>
  <circle cx="34" cy="28" r="5.5" fill="#DC143C"/>
  <circle cx="54" cy="28" r="5.5" fill="#B026FF"/>
  <circle cx="74" cy="28" r="5.5" fill="#00E5FF"/>
  <text x="380" y="33" text-anchor="middle" font-size="13" fill="#8a8aa0">root@hesam-oxe: ~/kernel — summon_operator.sh</text>

  <!-- boot lines (loop 11s) -->
  <g font-size="14.5">
    <text x="34" y="80" fill="#39FF14">root@hesam-oxe:~# ./summon_operator.sh
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.04;0.06;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="116" fill="#E6E6E6">[ <tspan fill="#39FF14"> OK  </tspan>] mounting /dev/talent ................ done
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.16;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="152" fill="#E6E6E6">[ <tspan fill="#39FF14"> OK  </tspan>] loading modules :: asm·rust·go·c·cpp·py·ts
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.28;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="188" fill="#E6E6E6">[ <tspan fill="#FFB000">WARN </tspan>] social-life.service not found — skipping
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.40;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="224" fill="#E6E6E6">[ <tspan fill="#00E5FF"> OK  </tspan>] privilege escalation → <tspan font-weight="700" fill="#DC143C">ROOT</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.52;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="260" fill="#DC143C" font-weight="700">[ BOOT ] HESAM JAMALI :: KERNEL-LEVEL OPERATOR READY
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.62;0.64;1" dur="11s" repeatCount="indefinite"/>
    </text>

    <text x="34" y="296" fill="#39FF14">root@hesam-oxe:~# █
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.74;0.76;1" dur="11s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- blinking cursor on last prompt -->
  <rect x="230" y="284" width="9" height="16" fill="#39FF14" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.76;0.78;0.96;0.98;1" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline sweep -->
  <rect x="12" y="0" width="736" height="2.5" fill="#DC143C" opacity="0.13">
    <animate attributeName="y" values="46;316;46" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
