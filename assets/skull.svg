<svg xmlns="http://www.w3.org/2000/svg" width="380" height="240" viewBox="0 0 380 240" font-family="'Cascadia Code','Fira Code',Consolas,Menlo,monospace">
  <defs>
    <radialGradient id="skullBg" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#12060a"/>
      <stop offset="1" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B6B" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#DC143C" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a38"/>
      <stop offset="1" stop-color="#16161f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="380" height="240" rx="10" fill="url(#skullBg)" stroke="#DC143C" stroke-width="1"/>
  <text x="190" y="24" text-anchor="middle" font-size="12" letter-spacing="4" fill="#DC143C">// CRT SKULL · TERMINAL GUARDIAN</text>

  <g transform="translate(190,128)">
    <!-- cranium : rounded square CRT style -->
    <path d="M-58,-44 Q-64,-52 -64,-62 Q-64,-86 -34,-94 Q0,-102 34,-94 Q64,-86 64,-62 Q64,-52 58,-44 L54,-16 Q52,-4 40,0 L20,4 L-20,4 L-40,0 Q-52,-4 -54,-16 Z"
          fill="url(#boneG)" stroke="#3a3a55" stroke-width="1.5"/>

    <!-- nasal cavity -->
    <path d="M0,-26 L6,-8 L0,-2 L-6,-8 Z" fill="#050508" stroke="#3a3a55" stroke-width="1"/>

    <!-- teeth : grinding in jaw that opens/closes -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 5;0 0;0 0" keyTimes="0;0.42;0.5;0.58;1" dur="2.2s" repeatCount="indefinite"/>
      <rect x="-26" y="6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="-14" y="6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="-2" y="6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="10" y="6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="22" y="6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="-26" y="-6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="-14" y="-6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="-2" y="-6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="10" y="-6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
      <rect x="22" y="-6" width="9" height="14" rx="2" fill="#1c1c28" stroke="#3a3a55"/>
    </g>

    <!-- eye sockets : glowing, blinking -->
    <g>
      <!-- left eye -->
      <ellipse cx="-28" cy="-58" rx="15" ry="13" fill="#050508" stroke="#3a3a55" stroke-width="1.5"/>
      <circle cx="-28" cy="-58" r="9" fill="url(#eyeGlow)">
        <animate attributeName="r" values="9;9;1.5;9" keyTimes="0;0.46;0.5;0.54" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-28" cy="-58" r="4" fill="#FFD0D0">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.46;0.5;0.54;1" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;4;1;4" keyTimes="0;0.46;0.5;0.54" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <!-- eye dart : pupil scans left-right -->
      <circle cx="-28" cy="-58" r="1.8" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="cx" values="-31;-25;-31" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- right eye -->
      <ellipse cx="28" cy="-58" rx="15" ry="13" fill="#050508" stroke="#3a3a55" stroke-width="1.5"/>
      <circle cx="28" cy="-58" r="9" fill="url(#eyeGlow)">
        <animate attributeName="r" values="9;9;1.5;9" keyTimes="0;0.46;0.5;0.54" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="-58" r="4" fill="#FFD0D0">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.46;0.5;0.54;1" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="4;4;1;4" keyTimes="0;0.46;0.5;0.54" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="28" cy="-58" r="1.8" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="cx" values="25;31;25" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- crack on the cranium : glows faintly, lightning up occasionally -->
    <path d="M-10,-94 L-4,-78 L-12,-62 L-2,-48" fill="none" stroke="#0a0a12" stroke-width="2">
      <animate attributeName="stroke" values="#0a0a12;#0a0a12;#DC143C;#0a0a12;#0a0a12" keyTimes="0;0.7;0.74;0.78;1" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- CRT scan flicker over the whole skull -->
    <rect x="-64" y="-102" width="128" height="112" fill="#DC143C" opacity="0">
      <animate attributeName="opacity" values="0;0;0.08;0;0" keyTimes="0;0.7;0.72;0.74;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="190" y="226" text-anchor="middle" font-size="11" letter-spacing="3" fill="#8a8aa0">GUARDING THE REPO · <tspan fill="#DC143C">SEES EVERY PUSH</tspan></text>
</svg>
